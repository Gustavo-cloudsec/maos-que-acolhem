    <nav class="menu-desktop" aria-label="Navegação principal">

<nav class="menu-mobile" aria-label="Navegação para celular">

    <main>
        <h2>Cadastro de voluntários</h2>
        <p>Preencha seus dados para demonstrar interesse em ajudar.</p>

        <form>
            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>
                <br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
                <br>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
                <br>

                <label for="cpf">CPF (somente números):</label>
                <input type="text" id="cpf" name="cpf" pattern="[0-9]{11}" title="Digite 11 números" required>
                <br>

                <label for="telefone">Telefone (somente números):</label>
                <input type="tel" id="telefone" name="telefone" pattern="[0-9]{10,11}" title="Digite 10 ou 11 números" required>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <label for="endereco">Rua e número:</label>
                <input type="text" id="endereco" name="endereco" required>
                <br>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>
                <br>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" required>
                <br>

                <label for="cep">CEP (somente números):</label>
                <input type="text" id="cep" name="cep" pattern="[0-9]{8}" title="Digite 8 números" required>
            </fieldset>

            <button type="submit">Enviar</button>
        </form>
    </main>

    <footer>
        <p>Mãos que Acolhem — projeto fictício.</p>
    </footer>
</body>
</html>
