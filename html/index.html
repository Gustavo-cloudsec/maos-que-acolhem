<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mãos que Acolhem</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/armazenamento.js" defer></script>
    <script src="../js/formulario.js" defer></script>
    <script src="../js/main.js" defer></script>
</head>
<body>
    <header>
        <h1>Mãos que Acolhem</h1>
    </header>

    <nav class="menu-desktop" aria-label="Navegação principal">
        <a href="#inicio">Início</a>
        <details>
            <summary>Participar</summary>
            <div class="opcoes">
                <a href="#projetos">Projetos</a>
                <a href="#cadastro">Cadastro</a>
            </div>
        </details>
    </nav>

    <nav class="menu-mobile" aria-label="Navegação para celular">
        <details>
            <summary>☰ Menu</summary>
            <div class="opcoes">
                <a href="#inicio">Início</a>
                <a href="#projetos">Projetos</a>
                <a href="#cadastro">Cadastro</a>
            </div>
        </details>
    </nav>

    <main id="conteudo" tabindex="-1"></main>

    <template id="inicio">
        <section>
            <h2>Sobre a ONG</h2>
            <p>A Mãos que Acolhem arrecada alimentos para ajudar famílias da comunidade.</p>
            <picture>
                <source
                    type="image/webp"
                    srcset="../imagens/doacoes-320.webp 320w,
                            ../imagens/doacoes-600.webp 600w"
                    sizes="(min-width: 1024px) 360px,
                           (min-width: 768px) 50vw,
                           100vw">
                <img src="../imagens/doacoes.jpg"
                     alt="Pessoa servindo uma refeição a outra pessoa"
                     width="600" height="399">
            </picture>
        </section>

        <section>
            <h2>Nosso projeto</h2>
            <p>Organizamos cestas de alimentos com a ajuda de doadores e voluntários.</p>
        </section>

        <section>
            <h2>Contato</h2>
            <p>E-mail: contato@maosqueacolhem.example.com</p>
        </section>
    </template>

    <template id="projetos">
        <section>
            <h2>Projeto de cestas de alimentos</h2>
            <span class="etiqueta">Projeto em andamento</span>
            <p>Organizamos cestas de alimentos para ajudar famílias da comunidade.</p>
            <button class="abrir-modal" type="button"
                    aria-haspopup="dialog" aria-controls="modal-projeto">
                Saiba mais
            </button>
        </section>

        <section>
            <h2>Doações</h2>
            <p>As pessoas podem contribuir com alimentos ou com doações financeiras para apoiar o projeto.</p>
        </section>

        <section>
            <h2>Voluntariado</h2>
            <p>Os voluntários ajudam a organizar os alimentos e a preparar as cestas.</p>
            <aside class="alerta" aria-label="Orientação para voluntários">
                Quer ajudar a organizar as cestas? Acesse a página de
                <a href="#cadastro">cadastro</a>.
            </aside>
        </section>
    </template>

    <template id="cadastro">
        <h2>Cadastro de voluntários</h2>
        <p>Preencha seus dados para demonstrar interesse em ajudar.</p>

        <form id="form-cadastro" novalidate autocomplete="on">
            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome"
                       autocomplete="name" required>
                <br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
                <br>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento"
                       autocomplete="off" required>
                <br>

                <label for="cpf">CPF — digite somente números</label>
                <input type="text" id="cpf" name="cpf" autocomplete="off"
                       inputmode="numeric" maxlength="11"
                       pattern="[0-9]{11}" title="Digite 11 números" required>
                <br>

                <label for="telefone">Telefone — digite somente números</label>
                <input type="tel" id="telefone" name="telefone" autocomplete="tel"
                       inputmode="numeric" maxlength="11"
                       pattern="[0-9]{10,11}" title="Digite 10 ou 11 números" required>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <label for="endereco">Rua e número:</label>
                <input type="text" id="endereco" name="endereco"
                       autocomplete="street-address" required>
                <br>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade"
                       autocomplete="address-level2" required>
                <br>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado"
                       autocomplete="address-level1" required>
                <br>

                <label for="cep">CEP — digite somente números</label>
                <input type="text" id="cep" name="cep" autocomplete="postal-code"
                       inputmode="numeric" maxlength="8"
                       pattern="[0-9]{8}" title="Digite 8 números" required>
            </fieldset>

            <button type="submit">Enviar</button>
            <p id="mensagem-cadastro" role="status"></p>
        </form>
    </template>

    <dialog id="modal-projeto" aria-labelledby="titulo-modal">
        <h2 id="titulo-modal">Sobre o projeto</h2>
        <p>Reunimos doações de alimentos e organizamos cestas para famílias da comunidade.</p>
        <form method="dialog">
            <button type="submit">Fechar</button>
        </form>
    </dialog>

    <footer>
        <p>Mãos que Acolhem — projeto fictício.</p>
    </footer>
</body>
</html>
